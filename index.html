<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/leaf_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>leeflet</title>
    <!-- Prevent theme flash before paint -->
    <style>
      :root {
        background-color: #f9fafb;
      }
      :root.dark {
        background-color: #121214;
      }
      html, body {
        background-color: inherit;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('leaf_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#121214';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f9fafb';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="text-[#1e2022] dark:text-[#f4f4f5] font-sans antialiased select-none overflow-hidden h-screen w-screen bg-transparent">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
